[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-zettelkasten"
version = "0.5.9"
description = "Local connected Markdown note editor for a personal Zettelkasten"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
zettelkasten = "zettelkasten.app:main"

[tool.setuptools.packages.find]
where = ["src"]
